<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-M-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creador d'Animacions</title>
    <!-- Incloure Tailwind CSS des del CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Incloure JSZip per a la generació del fitxer ZIP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        /* Configuració del tema Tailwind i la font Inter */
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
        
        /* Estil per al divisor redimensionable */
        .resize-handle {
            width: 8px;
            cursor: col-resize;
            background-color: #e5e7eb; /* gray-200 */
            transition: background-color 0.2s;
        }
        .resize-handle:hover {
            background-color: #3b82f6; /* blue-500 */
        }

        /* Estil per a l'indicador de posició en arrossegar */
        .drop-indicator {
            height: 2px;
            background-color: #3b82f6; /* blue-500 */
            width: 100%;
        }

        /* Estils per a la llista Drag & Drop */
        .list-item {
            cursor: grab;
            transition: background-color 0.15s, opacity 0.3s, border-left 0.3s;
            border-left: 5px solid transparent; /* Per al destacat visual */
        }
        .list-item.dragging {
            opacity: 0.4;
        }
        .list-item.is-current {
            background-color: #e0e7ff; /* indigo-100 */
            border-left: 5px solid #4f46e5; /* indigo-600 */
            font-weight: 600;
        }
        .list-item.disabled {
            opacity: 0.5;
            text-decoration: line-through;
            cursor: default;
        }
        .list-item.disabled .drag-handle {
            cursor: default;
        }

        /* Spinner */
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-left-color: #3b82f6; /* blue-500 */
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "jszip": "https://aistudiocdn.com/jszip@^3.10.1",
    "file-saver": "https://aistudiocdn.com/file-saver@^2.0.5"
  }
}
</script>
</head>
<body class="bg-gray-50 font-sans">
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
</body>
</html>
